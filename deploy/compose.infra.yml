# Hạ tầng cho môi trường local MỘT LỆNH của billing (độc lập với stack ecommerce).
# Chạy cùng compose.services.yml qua compose.local.yml:
#   cp deploy/.env.example deploy/.env      # điền các mật khẩu mẫu local
#   docker compose -f deploy/compose.local.yml --env-file deploy/.env up -d --build
name: billing-local

networks:
  backbone: {}

volumes:
  sqlserver-data: {}
  rabbitmq-data: {}
  elasticsearch-data: {}

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${BILLING_SQLSERVER_SA_PASSWORD:?copy deploy/.env.example to deploy/.env}
    ports: ['${LOCAL_SQL_PORT:-11433}:1433']
    volumes: [sqlserver-data:/var/opt/mssql]
    networks: [backbone]
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SET NOCOUNT ON; IF EXISTS (SELECT 1 FROM sys.databases WHERE state_desc <> 'ONLINE') RAISERROR('databases still recovering', 16, 1);" || exit 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${BILLING_RABBITMQ_ADMIN_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${BILLING_RABBITMQ_ADMIN_PASSWORD:?copy deploy/.env.example to deploy/.env}
    ports:
      - '${LOCAL_AMQP_PORT:-15673}:5672'
      - '${LOCAL_RABBITMQ_MGMT_PORT:-15674}:15672'
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    networks: [backbone]
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  billing-sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver: { condition: service_healthy }
    networks: [backbone]
    restart: 'no'
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: ${BILLING_SQLSERVER_SA_PASSWORD:?set in deploy/.env}
      WALLET_DB_PASSWORD: ${BILLING_WALLET_DB_PASSWORD:?set in deploy/.env}
      PAYMENT_DB_PASSWORD: ${BILLING_PAYMENT_DB_PASSWORD:?set in deploy/.env}
      WALLET_MIGRATOR_PASSWORD: ${BILLING_WALLET_MIGRATOR_DB_PASSWORD:?set in deploy/.env}
      PAYMENT_MIGRATOR_PASSWORD: ${BILLING_PAYMENT_MIGRATOR_DB_PASSWORD:?set in deploy/.env}
    volumes: ['./sql/init.sql:/init/init.sql:ro']
    # $$ để shell trong container mở rộng biến, giữ mật khẩu khỏi `docker inspect`.
    entrypoint:
      - /bin/bash
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$SA_PASSWORD" -C -b
        -v WALLET_DB_PASSWORD="$$WALLET_DB_PASSWORD" PAYMENT_DB_PASSWORD="$$PAYMENT_DB_PASSWORD"
        WALLET_MIGRATOR_PASSWORD="$$WALLET_MIGRATOR_PASSWORD" PAYMENT_MIGRATOR_PASSWORD="$$PAYMENT_MIGRATOR_PASSWORD"
        -i /init/init.sql

  billing-rabbitmq-init:
    image: curlimages/curl:8.10.1
    depends_on:
      rabbitmq: { condition: service_healthy }
    networks: [backbone]
    restart: 'no'
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_MGMT_PORT: '15672'
      RABBITMQ_ADMIN_USER: ${BILLING_RABBITMQ_ADMIN_USER:-guest}
      RABBITMQ_ADMIN_PASSWORD: ${BILLING_RABBITMQ_ADMIN_PASSWORD:?set in deploy/.env}
      WALLET_MQ_PASSWORD: ${BILLING_WALLET_MQ_PASSWORD:?set in deploy/.env}
      PAYMENT_MQ_PASSWORD: ${BILLING_PAYMENT_MQ_PASSWORD:?set in deploy/.env}
      ECOMMERCE_MQ_PASSWORD: ${BILLING_ECOMMERCE_MQ_PASSWORD:?set in deploy/.env}
    volumes: ['./scripts/init-rabbitmq.sh:/init/init-rabbitmq.sh:ro']
    entrypoint: ['/bin/sh', '/init/init-rabbitmq.sh']

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    ports: ['${LOCAL_ELASTICSEARCH_PORT:-19200}:9200']
    volumes: [elasticsearch-data:/usr/share/elasticsearch/data]
    networks: [backbone]
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:9200/_cluster/health | grep -Eq '"status":"(green|yellow)"' || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.4
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      # Alerting cần khóa mã hóa saved objects (>= 32 ký tự).
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?set in deploy/.env (>= 32 characters)}
    ports: ['${LOCAL_KIBANA_PORT:-15601}:5601']
    depends_on:
      elasticsearch: { condition: service_healthy }
    networks: [backbone]
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:5601/api/status | grep -q '"level":"available"' || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ['--config=/etc/otel/config.yaml']
    ports: ['${LOCAL_OTLP_GRPC_PORT:-14317}:4317']
    volumes: ['./otel/collector-config.yaml:/etc/otel/config.yaml:ro']
    depends_on:
      elasticsearch: { condition: service_healthy }
    networks: [backbone]
